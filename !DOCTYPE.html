<index.html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ratnesh Sawant — Developer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "hsl(var(--bg))",
            surface: "hsl(var(--surface))",
            "text-primary": "hsl(var(--text))",
            muted: "hsl(var(--muted))",
            stroke: "hsl(var(--stroke))",
          },
          fontFamily: {
            body: ['Inter', 'sans-serif'],
            display: ['"Instrument Serif"', 'serif'],
          },
          animation: {
            'scroll-down': 'scroll-down 1.5s ease-in-out infinite',
            'role-fade-in': 'role-fade-in 0.4s ease-out',
          },
          keyframes: {
            'scroll-down': {
              '0%': { transform: 'translateY(-100%)' },
              '100%': { transform: 'translateY(200%)' },
            },
            'role-fade-in': {
              '0%': { opacity: 0, transform: 'translateY(8px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer base {
      :root {
        --bg: 0 0% 4%;
        --surface: 0 0% 8%;
        --text: 0 0% 96%;
        --muted: 0 0% 53%;
        --stroke: 0 0% 12%;
      }
      body {
        @apply bg-bg text-text-primary font-body antialiased overflow-x-hidden;
      }
    }
    @layer utilities {
      .accent-gradient {
        background: linear-gradient(90deg, #89AACC 0%, #4E85BF 100%);
      }
      .accent-border-hover {
        position: relative;
        z-index: 1;
      }
      .accent-border-hover::before {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: inherit;
        background: linear-gradient(90deg, #89AACC 0%, #4E85BF 100%);
        z-index: -1;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .accent-border-hover:hover::before {
        opacity: 1;
      }
    }
  </style>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, AnimatePresence } = window.Motion;
    gsap.registerPlugin(ScrollTrigger);

    // Reusable Icon SVG
    const ArrowUpRight = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M7 17L17 7" /><path d="M7 7h10v10" />
      </svg>
    );

    // --- Loading Screen ---
    const LoadingScreen = ({ onComplete }) => {
      const [count, setCount] = useState(0);
      const words = ["Design", "Create", "Inspire"];
      const [wordIdx, setWordIdx] = useState(0);

      useEffect(() => {
        const wordInterval = setInterval(() => {
          setWordIdx((prev) => (prev + 1) % words.length);
        }, 900);

        const duration = 2700;
        const interval = 16;
        const steps = duration / interval;
        const increment = 100 / steps;
        
        const countTimer = setInterval(() => {
          setCount((prev) => {
            if (prev + increment >= 100) {
              clearInterval(countTimer);
              clearInterval(wordInterval);
              setTimeout(onComplete, 400);
              return 100;
            }
            return prev + increment;
          });
        }, interval);

        return () => {
          clearInterval(countTimer);
          clearInterval(wordInterval);
        };
      }, [onComplete]);

      return (
        <div className="fixed inset-0 z-[9999] bg-bg flex flex-col items-center justify-center">
          <div className="absolute top-8 left-8 text-xs text-muted uppercase tracking-[0.3em] animate-[fade-in_1s_ease-out]">Portfolio</div>
          
          <div className="h-20 overflow-hidden relative flex justify-center items-center">
            <AnimatePresence mode="wait">
              <motion.div
                key={wordIdx}
                initial={{ y: 40, opacity: 0 }}
                animate={{ y: 0, opacity: 1 }}
                exit={{ y: -40, opacity: 0 }}
                transition={{ duration: 0.4, ease: "easeOut" }}
                className="text-4xl md:text-6xl lg:text-7xl font-display italic text-text-primary/80 absolute"
              >
                {words[wordIdx]}
              </motion.div>
            </AnimatePresence>
          </div>

          <div className="absolute bottom-16 right-12 text-6xl md:text-8xl lg:text-9xl font-display text-text-primary tabular-nums">
            {String(Math.floor(count)).padStart(3, '0')}
          </div>

          <div className="absolute bottom-0 left-0 right-0 h-[3px] bg-stroke/50">
            <div 
              className="h-full accent-gradient origin-left shadow-[0_0_8px_rgba(137,170,204,0.35)] transition-transform duration-75"
              style={{ transform: `scaleX(${count / 100})` }}
            />
          </div>
        </div>
      );
    };

    // --- Global Background Component ---
    const GlobalBackground = () => {
      const videoRef = useRef(null);

      useEffect(() => {
        if (videoRef.current) {
          const src = "https://stream.mux.com/Aa02T7oM1wH5Mk5EEVDYhbZ1ChcdhRsS2m1NYyx4Ua1g.m3u8";
          if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(src);
            hls.attachMedia(videoRef.current);
          } else if (videoRef.current.canPlayType('application/vnd.apple.mpegurl')) {
            videoRef.current.src = src;
          }
        }
      }, []);

      return (
        <div className="fixed inset-0 z-[-1]">
          <video 
            ref={videoRef} 
            autoPlay 
            muted 
            loop 
            playsInline 
            className="w-full h-full object-cover" 
          />
          <div className="absolute inset-0 bg-black/40"></div> 
        </div>
      );
    };

    // --- Navigation ---
    const Navbar = () => {
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 100);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <nav className="fixed top-0 left-0 right-0 z-50 flex justify-center pt-4 md:pt-6 px-4 pointer-events-none">
          <div className={`pointer-events-auto inline-flex items-center rounded-full backdrop-blur-md border border-white/10 bg-surface/80 px-2 py-2 transition-shadow duration-300 ${scrolled ? 'shadow-md shadow-black/50' : ''}`}>
            <div className="w-9 h-9 rounded-full flex items-center justify-center relative group cursor-pointer">
              <div className="absolute inset-0 rounded-full accent-gradient group-hover:rotate-180 transition-transform duration-500"></div>
              <div className="absolute inset-[2px] rounded-full bg-bg flex items-center justify-center">
                <span className="font-display italic text-[13px] text-text-primary">RS</span>
              </div>
            </div>
            <div className="hidden md:block w-px h-5 bg-stroke mx-2"></div>
            {["Home", "Work", "About"].map((link) => (
              <a key={link} href={`#${link.toLowerCase()}`} className="text-xs sm:text-sm rounded-full px-3 sm:px-4 py-1.5 sm:py-2 text-muted hover:text-text-primary hover:bg-stroke/50 transition-colors">
                {link}
              </a>
            ))}
            <div className="w-px h-5 bg-stroke mx-1"></div>
            <a href="#contact" className="accent-border-hover text-xs sm:text-sm rounded-full cursor-pointer ml-1">
              <div className="bg-surface rounded-full backdrop-blur-md px-3 sm:px-4 py-1.5 sm:py-2 flex items-center gap-1">
                Say hi <ArrowUpRight size={14} />
              </div>
            </a>
          </div>
        </nav>
      );
    };

    // --- Hero Section ---
    const Hero = () => {
      const [roleIdx, setRoleIdx] = useState(0);
      const roles = ["Creative", "Fullstack", "Builder"];

      useEffect(() => {
        const interval = setInterval(() => setRoleIdx(p => (p + 1) % roles.length), 2000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        const tl = gsap.timeline();
        tl.fromTo(".blur-in", { opacity: 0, filter: "blur(10px)", y: 20 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 1, stagger: 0.1, delay: 0.3, ease: "power3.out" }, 0)
          .fromTo(".name-reveal", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 1.2, delay: 0.1, ease: "power3.out" }, 0);
      }, []);

      return (
        <section id="home" className="relative min-h-screen flex flex-col items-center justify-center overflow-hidden bg-transparent">
          <div className="relative z-10 text-center px-4 flex flex-col items-center mt-12">
            <p className="blur-in text-xs text-muted uppercase tracking-[0.3em] mb-8">PORTFOLIO </p>
            <h1 className="name-reveal text-6xl md:text-8xl lg:text-9xl font-display italic leading-[0.9] tracking-tight text-text-primary mb-6">Ratnesh Sawant</h1>
            <p className="blur-in text-sm md:text-base text-muted max-w-md mb-4 flex items-center justify-center gap-2">
              A <span key={roleIdx} className="font-display italic text-text-primary animate-role-fade-in inline-block text-xl">{roles[roleIdx]}</span> developer from India.
            </p>
            <p className="blur-in text-sm md:text-base text-muted max-w-md mb-12 leading-relaxed">
            AI enthusiast focused on building intelligent systems, AI agents and modern Android applications. Interested in automation, secure communication, and real-world
            </p>
            
            <div className="blur-in flex gap-4 flex-wrap justify-center">
              <a href="#work" className="accent-border-hover rounded-full cursor-pointer">
                <div className="bg-text-primary text-bg hover:bg-bg hover:text-text-primary transition-colors text-sm font-semibold px-7 py-3.5 rounded-full flex items-center gap-2">
                  See Works <ArrowUpRight size={16} />
                </div>
              </a>
              <a href="#contact" className="accent-border-hover rounded-full cursor-pointer">
                <div className="border-2 border-stroke/30 bg-black/20 backdrop-blur-sm text-text-primary transition-colors text-sm font-semibold px-7 py-3.5 rounded-full hover:border-transparent">
                  Reach out...
                </div>
              </a>
            </div>
          </div>

          <div className="absolute bottom-8 z-10 flex flex-col items-center gap-4 blur-in">
            <span className="text-[10px] text-muted uppercase tracking-[0.2em]">SCROLL</span>
            <div className="w-px h-10 bg-stroke relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-full accent-gradient animate-scroll-down"></div>
            </div>
          </div>
        </section>
      );
    };

    // --- Selected Works ---
   // --- Selected Works ---
    const Works = () => {
      const containerRef = useRef(null);
      const imgRef = useRef(null);

      useEffect(() => {
        // GSAP Parallax on the image - dialed down slightly to prevent clipping on a square frame
        const ctx = gsap.context(() => {
          gsap.fromTo(imgRef.current, 
            { yPercent: -5 }, 
            { 
              yPercent: 5, 
              ease: "none",
              scrollTrigger: {
                trigger: containerRef.current,
                start: "top bottom",
                end: "bottom top",
                scrub: 1.5 // Smooth scrubbing
              }
            }
          );
        });
        return () => ctx.revert();
      }, []);

      return (
        <section id="work" className="bg-black/60 backdrop-blur-md py-16 md:py-24 border-t border-stroke/20">
          <div className="max-w-[1200px] mx-auto px-6 md:px-10 lg:px-16">
            <motion.div 
              initial={{ opacity: 0, y: 30 }}
              whileInView={{ opacity: 1, y: 0 }}
              transition={{ duration: 1, ease: [0.25,0.1,0.25,1] }}
              viewport={{ once: true, margin: "-100px" }}
              className="mb-12 flex flex-col md:flex-row md:items-end justify-between gap-6"
            >
              <div>
                <div className="flex items-center gap-4 mb-4">
                  <div className="w-8 h-px bg-stroke"></div>
                  <span className="text-xs text-muted uppercase tracking-[0.3em]">01 — Projects</span>
                </div>
                <h2 className="text-4xl md:text-5xl font-display text-text-primary">Featured <em className="italic text-muted">project</em></h2>
                <p className="text-muted text-sm mt-4 max-w-sm">An application I built from concept to launch.</p>
              </div>
            </motion.div>

            <div className="grid grid-cols-1 md:grid-cols-12 gap-5 md:gap-6" ref={containerRef}>
              <div className="relative group overflow-hidden rounded-3xl md:col-span-12 bg-black/40 backdrop-blur-xl border border-stroke/30 flex flex-col md:flex-row items-center min-h-[400px]">
                  <div className="absolute inset-0 bg-[radial-gradient(circle,#fff_1px,transparent_1px)] bg-[size:20px_20px] opacity-[0.03] pointer-events-none"></div>
                  
                  {/* Project Info */}
                  <div className="w-full md:w-1/2 p-8 md:p-12 z-10 flex flex-col justify-center transition-transform duration-[1.5s] ease-[cubic-bezier(0.16,1,0.3,1)] group-hover:translate-x-2">
                    <h3 className="text-5xl font-display italic text-text-primary mb-6">NearLink</h3>
                    <p className="text-muted text-sm md:text-base leading-relaxed mb-8">
                      NearLink is designed to enable secure, fast, and seamless communication between nearby devices using Bluetooth,NFC and modern wireless communication technologies. The project focuses on real-time data exchange, smart connectivity, and efficient peer-to-peer interaction.
                    </p>
                    <div className="flex flex-wrap gap-2">
                        <span className="text-[10px] uppercase tracking-wider px-3 py-1.5 border border-stroke/50 rounded-full text-muted bg-white/5 transition-colors group-hover:bg-white/10 group-hover:text-text-primary">Kotlin</span>
                        <span className="text-[10px] uppercase tracking-wider px-3 py-1.5 border border-stroke/50 rounded-full text-muted bg-white/5 transition-colors group-hover:bg-white/10 group-hover:text-text-primary">Jetpack Compose</span>
                        <span className="text-[10px] uppercase tracking-wider px-3 py-1.5 border border-stroke/50 rounded-full text-muted bg-white/5 transition-colors group-hover:bg-white/10 group-hover:text-text-primary">NFC / Bluetooth</span>
                    </div>
                  </div>

                  {/* Project Image with Parallax & Hover Reveal */}
                  <div className="w-full md:w-1/2 p-8 md:p-12 flex justify-center items-center z-10 h-full">
                    {/* Changed container to aspect-square and a max-width to look like a clean app icon card */}
                    <div className="relative w-full max-w-[340px] aspect-square rounded-2xl overflow-hidden border border-stroke/20 shadow-[0_0_30px_rgba(0,0,0,0.5)] bg-black flex items-center justify-center group-hover:shadow-[0_0_50px_rgba(137,170,204,0.15)] transition-all duration-[1.5s] ease-[cubic-bezier(0.16,1,0.3,1)]">
                     <img 
                       ref={imgRef}
                       src="nearlink-logo.png" 
                       alt="NearLink Logo" 
                       /* Changed to object-cover to fill the square completely without black bars */
                       className="absolute inset-0 w-full h-full object-cover scale-[1.12] group-hover:scale-[1.2] transition-transform duration-[2s] ease-[cubic-bezier(0.16,1,0.3,1)]" 
                     />
                    </div>
                  </div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    // --- Stats Grid ---
    const Stats = () => (
      <section className="bg-black/70 backdrop-blur-md py-16 md:py-24 border-y border-stroke/20">
        <div className="max-w-[1000px] mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-12 text-center">
          <motion.div initial={{ opacity: 0, y: 40 }} whileInView={{ opacity: 1, y: 0 }} transition={{ duration: 0.8, ease: [0.16, 1, 0.3, 1] }} viewport={{ once: true, margin: "-50px" }}>
            <div className="text-5xl md:text-6xl font-display italic accent-gradient text-transparent bg-clip-text mb-2">3+</div>
            <div className="text-sm text-text-primary font-medium tracking-widest uppercase mb-1">Languages Mastered</div>
            <div className="text-xs text-muted/70 tracking-widest uppercase mt-2">Python • Java • Kotlin</div>
          </motion.div>
          <motion.div initial={{ opacity: 0, y: 40 }} whileInView={{ opacity: 1, y: 0 }} transition={{ duration: 1, delay: 0.15, ease: [0.16, 1, 0.3, 1] }} viewport={{ once: true, margin: "-50px" }}>
            <div className="text-5xl md:text-6xl font-display italic accent-gradient text-transparent bg-clip-text mb-2">1</div>
            <div className="text-sm text-text-primary font-medium tracking-widest uppercase mb-1">App Deployed</div>
            <div className="text-xs text-muted/70 tracking-widest uppercase mt-2">NearLink</div>
          </motion.div>
          <motion.div initial={{ opacity: 0, y: 40 }} whileInView={{ opacity: 1, y: 0 }} transition={{ duration: 1.2, delay: 0.3, ease: [0.16, 1, 0.3, 1] }} viewport={{ once: true, margin: "-50px" }}>
            <div className="text-5xl md:text-6xl font-display italic accent-gradient text-transparent bg-clip-text mb-2">100%</div>
            <div className="text-sm text-text-primary font-medium tracking-widest uppercase mb-1">Passion Driven</div>
            <div className="text-xs text-muted/70 tracking-widest uppercase mt-2">Always Shipping and Learning</div>
          </motion.div>
        </div>
      </section>
    );

    // --- About Section ---
    const About = () => {
      // Framer Motion variants for stagger and text mask
      const containerVariants = {
        hidden: { opacity: 0 },
        show: {
          opacity: 1,
          transition: { staggerChildren: 0.15, delayChildren: 0.2 }
        }
      };

      const maskItemVariants = {
        hidden: { y: "100%", opacity: 0 },
        show: { 
          y: "0%", 
          opacity: 1, 
          transition: { duration: 0.9, ease: [0.16, 1, 0.3, 1] } 
        }
      };

      return (
        <section id="about" className="bg-black/60 backdrop-blur-md py-16 md:py-32">
          <div className="max-w-[1200px] mx-auto px-6 md:px-10 lg:px-16">
            <motion.div 
              variants={containerVariants}
              initial="hidden"
              whileInView="show"
              viewport={{ once: true, margin: "-100px" }}
            >
              <div className="overflow-hidden mb-4">
                <motion.div variants={maskItemVariants} className="flex items-center gap-4">
                  <div className="w-8 h-px bg-stroke"></div>
                  <span className="text-xs text-muted uppercase tracking-[0.3em]">02 — About Me</span>
                </motion.div>
              </div>
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-12 mt-12">
                <div className="overflow-hidden">
                  <motion.h2 variants={maskItemVariants} className="text-4xl md:text-6xl font-display text-text-primary leading-[1.1]">
                    The Person <br/><em className="italic text-muted">Behind the Code</em>
                  </motion.h2>
                </div>
                
                <div className="bg-black/40 p-8 rounded-2xl border border-stroke/20 backdrop-blur-lg">
                  <div className="space-y-6 text-muted text-sm md:text-base leading-relaxed">
                    <div className="overflow-hidden">
                      <motion.p variants={maskItemVariants}>
                        I'm <strong className="text-text-primary font-medium">Ratnesh Sawant</strong> — a developer and student at <em className="text-text-primary not-italic font-medium">Universal Skilltech University</em>, driven by a real obsession with building things that actually work.
                      </motion.p>
                    </div>
                    <div className="overflow-hidden">
                      <motion.p variants={maskItemVariants}>
                        My journey started with curiosity and grew into shipping <strong className="text-text-primary font-medium">NearLink</strong> — an Android app that uses NFC and Bluetooth to create seamless contactless connections between devices. That project taught me more than any classroom. I prefer building real systems over endlessly consuming tutorials.
                      </motion.p>
                    </div>
                    <div className="overflow-hidden">
                      <motion.p variants={maskItemVariants}>
                        Building seamless digital experiences that simply work.
                      </motion.p>
                    </div>
                  </div>
                </div>
              </div>
            </motion.div>
          </div>
        </section>
      );
    };

    // --- Footer / Contact ---
    const Footer = () => {
      return (
        <footer id="contact" className="relative bg-black/80 backdrop-blur-xl pt-16 md:pt-20 pb-16 overflow-hidden border-t border-stroke/30">
           
           <div className="relative z-10 text-center px-4 max-w-2xl mx-auto mt-12 mb-12">
             
             {/* Heading */}
             <h2 className="text-4xl md:text-5xl font-bold uppercase tracking-tight text-[#4E85BF] mb-6 font-body">
               Let's Connect
             </h2>
             
             {/* Subtext */}
             <p className="text-text-primary tracking-wide text-lg md:text-xl font-light mb-12 font-body">
               Building intelligent experiences for the next digital era.
             </p>

             {/* Social Icon Buttons */}
             <div className="flex justify-center items-center gap-4 md:gap-6">
               
               {/* 1. GitHub */}
               <a 
                 href="https://github.com/ratneshjee01-alt" 
                 target="_blank" 
                 rel="noopener noreferrer"
                 className="w-14 h-14 rounded-full bg-[#111] border border-stroke/50 flex items-center justify-center text-text-primary hover:text-white hover:border-white hover:shadow-[0_0_15px_rgba(255,255,255,0.2)] transition-all duration-300"
               >
                 <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
               </a>

               {/* 2. Email */}
               <a 
                 href="mailto:your.ratneshjee01.com" 
                 className="w-14 h-14 rounded-full bg-[#111] border border-stroke/50 flex items-center justify-center text-text-primary hover:text-white hover:border-white hover:shadow-[0_0_15px_rgba(255,255,255,0.2)] transition-all duration-300"
               >
